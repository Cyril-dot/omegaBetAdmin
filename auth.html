<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ZynoBet — Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0b0e14;
  --surface:   #12161f;
  --border:    rgba(255,255,255,0.07);
  --accent:    #00e5a0;
  --accent2:   #00b87a;
  --text:      #f0f2f5;
  --muted:     #6b7280;
  --error:     #ff5c6a;
  --success:   #00e5a0;
  --radius:    14px;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 10%, rgba(0,229,160,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 80% 90%, rgba(0,100,255,0.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.page {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 32px;
  animation: fadeDown 0.5s ease both;
}

.brand-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 24px rgba(0,229,160,0.35);
}

.brand-icon svg {
  width: 22px;
  height: 22px;
  fill: #0b0e14;
}

.brand-name {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
}

.brand-name span { color: var(--accent); }

.card {
  width: 100%;
  max-width: 428px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 38px 34px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.45);
  animation: fadeUp 0.5s ease 0.1s both;
}

.card-header { margin-bottom: 30px; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(0,229,160,0.1);
  border: 1px solid rgba(0,229,160,0.22);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.badge svg {
  width: 11px;
  height: 11px;
  fill: var(--accent);
}

.card-title {
  font-family: 'Syne', sans-serif;
  font-size: 21px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.card-sub {
  font-size: 13.5px;
  color: var(--muted);
}

.form-group { margin-bottom: 20px; }

label {
  display: block;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 8px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.input-wrap { position: relative; }

.input-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  display: flex;
  align-items: center;
}

.input-icon svg {
  width: 16px;
  height: 16px;
  stroke: var(--muted);
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

input {
  width: 100%;
  height: 50px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14.5px;
  padding: 0 14px 0 44px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  -webkit-appearance: none;
}

input::placeholder { color: #3a3f4d; }

input:focus {
  border-color: rgba(0,229,160,0.45);
  box-shadow: 0 0 0 3px rgba(0,229,160,0.09);
  background: rgba(0,229,160,0.02);
}

.pass-input { padding-right: 48px; }

.toggle-pass {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 6px;
  display: flex;
  align-items: center;
  border-radius: 6px;
  transition: color 0.2s;
}

.toggle-pass:hover { color: var(--text); }

.toggle-pass svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.alert {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 15px;
  border-radius: 11px;
  font-size: 13.5px;
  margin-bottom: 22px;
  animation: fadeUp 0.25s ease;
  line-height: 1.5;
}

.alert svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.alert-error {
  background: rgba(255,92,106,0.1);
  border: 1px solid rgba(255,92,106,0.22);
  color: #ff8a93;
}
.alert-error svg { stroke: #ff5c6a; fill: none; }

.alert-success {
  background: rgba(0,229,160,0.1);
  border: 1px solid rgba(0,229,160,0.22);
  color: var(--accent);
}
.alert-success svg { stroke: var(--accent); fill: none; }

.submit-btn {
  width: 100%;
  height: 52px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  border-radius: var(--radius);
  color: #0b0e14;
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 26px;
  transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
  box-shadow: 0 4px 22px rgba(0,229,160,0.28);
  letter-spacing: 0.02em;
}

.submit-btn svg {
  width: 17px;
  height: 17px;
  stroke: #0b0e14;
  fill: none;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.submit-btn:hover:not(:disabled) {
  opacity: 0.9;
  transform: translateY(-1px);
  box-shadow: 0 8px 30px rgba(0,229,160,0.38);
}

.submit-btn:active:not(:disabled) { transform: translateY(0); }

.submit-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.spinner {
  width: 17px;
  height: 17px;
  border: 2.5px solid rgba(0,0,0,0.25);
  border-top-color: #0b0e14;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}

.footer {
  margin-top: 26px;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  animation: fadeUp 0.5s ease 0.2s both;
  opacity: 0.7;
}

@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .card { padding: 28px 22px; border-radius: 18px; }
  .brand-name { font-size: 24px; }
  .card-title { font-size: 19px; }
}
</style>
</head>
<body>
<div class="page">

  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M13 2L4.5 13.5H11L10 22L19.5 10.5H13L13 2Z"/></svg>
    </div>
    <div class="brand-name">Zyno<span>Bet</span></div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="badge">
        <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.5 3.5 10.7 8 12 4.5-1.3 8-6.5 8-12V6L12 2z"/></svg>
        Super Admin
      </div>
      <div class="card-title">Welcome back</div>
      <div class="card-sub">Sign in to manage your platform</div>
    </div>

    <div id="alert-box"></div>

    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
        </span>
        <input id="login-email" type="email"
               placeholder="admin@zynobet.app"
               autocomplete="email">
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input id="login-pass" type="password" class="pass-input"
               placeholder="Your password"
               autocomplete="current-password"
               onkeydown="if(event.key==='Enter')doLogin()">
        <button class="toggle-pass" id="eye-btn" onclick="togglePass()" type="button" aria-label="Toggle password visibility">
          <svg id="eye-icon" viewBox="0 0 24 24">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="submit-btn" id="login-btn" onclick="doLogin()" type="button">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Sign In
    </button>
  </div>

  <div class="footer">ZynoBet &copy; 2024 &nbsp;&middot;&nbsp; Super Admin Portal</div>

</div>

<script>
const BASE_URL = "https://futballbackend-production-b0ef.up.railway.app";

function togglePass() {
  const inp  = document.getElementById('login-pass');
  const icon = document.getElementById('eye-icon');
  const isPass = inp.type === 'password';
  inp.type = isPass ? 'text' : 'password';
  icon.innerHTML = isPass
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
}

function showAlert(msg, type) {
  const icons = {
    error:   '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
    success: '<polyline points="20 6 9 17 4 12"/>'
  };
  document.getElementById('alert-box').innerHTML =
    `<div class="alert alert-${type}">
       <svg viewBox="0 0 24 24">${icons[type]||icons.error}</svg>
       <span>${msg}</span>
     </div>`;
}

function clearAlert() { document.getElementById('alert-box').innerHTML = ''; }

async function doLogin() {
  clearAlert();
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;

  if (!email || !password) {
    showAlert('Email and password are required.', 'error');
    return;
  }

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Signing in…';

  try {
    const res  = await fetch(`${BASE_URL}/api/auth/login`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email, password })
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.message || json.error || `HTTP ${res.status}`);

    const token = json.data?.token || json.token || json.data?.accessToken || json.accessToken;
    if (!token) throw new Error('No token returned. Check your API login endpoint.');

    const role = json.data?.role || json.data?.user?.role || json.role || '';
    if (role && !['ADMIN', 'SUPER_ADMIN'].includes(role)) {
      throw new Error(`Access denied. Role "${role}" is not permitted.`);
    }

    localStorage.setItem('fb_token', token);
    showAlert('Login successful! Redirecting…', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 800);

  } catch (e) {
    showAlert(e.message, 'error');
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In`;
  }
}
</script>
</body>
</html>
